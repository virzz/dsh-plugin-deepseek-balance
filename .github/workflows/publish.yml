name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Two registries, two credentials. GitHub Packages authenticates with the workflow's own
# GITHUB_TOKEN, npmjs needs a repository secret named NPM_TOKEN. They are separate jobs so
# one registry being unavailable or unconfigured never blocks the other.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dependency-free gate: both halves must parse, the client module id must equal the
      # package name (@deepseek-ai/dsh-client-modules keys the browser roster by it), and the
      # name must stay scoped — both registries reject an unscoped publish.
      - name: Check the package
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node -e '
            const pkg = require("./package.json");
            const src = require("node:fs").readFileSync("lib/client.js", "utf8");
            const id = src.match(/id:\s*"([^"]+)"/)[1];
            if (id !== pkg.name) {
              console.error(`client module id "${id}" does not match package name "${pkg.name}"`);
              process.exit(1);
            }
            if (!pkg.name.startsWith("@")) {
              console.error("both registries require a scoped name");
              process.exit(1);
            }
            if (pkg.publishConfig) {
              console.error("publishConfig is set and would override the per-registry --registry flag; remove it");
              process.exit(1);
            }
            console.log(`${pkg.name}@${pkg.version} is ready to publish`);
          '

  github-packages:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@virzz'

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npmjs:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # NPM_TOKEN must be an npm access token with publish rights for the @virzz scope.
      # A scoped package is private by default, so --access public is required.
      - name: Publish to npmjs
        run: npm publish --registry=https://registry.npmjs.org --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
